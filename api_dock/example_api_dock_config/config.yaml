name: my-api
description: My API Dock instance
authors:
  - Your Name

# Remote APIs to proxy (add a file per remote in remotes/)
remotes:
  - example_remote

# SQL databases to query (add a file per database in databases/)
databases:
  - example_db

settings:
  add_trailing_slash: false   # Set true to auto-append trailing slash to proxied paths
  follow_redirects: true      # Set false to pass 3xx redirects through to the client
  timeout: 10                 # Upstream request timeout (seconds); null/false to disable
  # base_path: /dock          # Also serve the API under this prefix (e.g. behind a CDN path)
  # duckdb:                   # Database query options (DuckDB SET options + a concurrency cap)
  #   memory_limit: 700MB
  #   threads: 2
  #   max_concurrent_queries: 2

# Global route restrictions — applied to all remotes unless overridden per-remote.
# Uncomment to block DELETE on every remote:
# restricted:
#   - route: "*"
#     method: delete

# Optional catalog endpoints listing models/versions (opt-in; omit to disable).
# `expose: true` adds /databases, /remotes, and /sources.
# expose:
#   dict: true          # {model, version} dicts (false → "model/version" strings)
#   databases: true     # add /databases
#   remotes: true       # add /remotes
#   # sources: true     # add /sources (databases + remotes combined)
